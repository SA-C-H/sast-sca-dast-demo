name: Security scans

on: [push, pull_request]

jobs:
  sca-pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install pip-audit
      - run: pip-audit -r vulnerable_flask_app/requirements.txt
