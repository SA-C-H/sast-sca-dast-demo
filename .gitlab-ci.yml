stages:
  - sast
  - sca
  - dast

sast_sonarqube:
  stage: sast
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - sonar-scanner
      -Dsonar.projectKey=Vulnerable-Flask-App
      -Dsonar.sources=vulnerable_flask_app
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.token=$SONAR_TOKEN
  allow_failure: true

sca_pip_audit:
  stage: sca
  image: python:3.9-slim
  script:
    - pip install pip-audit
    - pip-audit -r vulnerable_flask_app/requirements.txt
  allow_failure: true

dast_zap:
  stage: dast
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker network create zap-network
    - docker build -t my-vulnerable-flask-app ./vulnerable_flask_app
    - docker run -d --name flask-app-container --network zap-network my-vulnerable-flask-app
    - sleep 10
    - docker run --name zap-scan --network zap-network -t ghcr.io/zaproxy/zaproxy:stable sh -c "mkdir -p /zap/wrk && zap-full-scan.py -t http://flask-app-container:5000 -I -r report.html -J report.json"
    - mkdir -p zap_reports
    - docker cp zap-scan:/zap/wrk/. zap_reports/
  artifacts:
    when: always
    paths:
      - zap_reports/
    expire_in: 5 days
  allow_failure: true
